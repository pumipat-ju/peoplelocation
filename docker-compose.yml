services:
  backend:
    container_name: peoplelocation-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    volumes:
        - ./backend/static:/app/static
        - ./backend/data:/app/data
        - ./backend/yolov8s.pt:/app/yolov8s.pt:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    container_name: peoplelocation-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
