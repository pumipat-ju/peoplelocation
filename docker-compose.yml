services:
  backend:
    container_name: peoplelocation-backend
    gpus: all
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    volumes:
        - ./backend/static:/app/static
        - ./backend/data:/app/data
        - ./backend/yolov8s.pt:/app/yolov8s.pt:ro
        - ${MODEL_WEIGHTS_DIR:-./weights}:/app/weights:ro
    environment:
      - PYTHONUNBUFFERED=1
      - IDENTITY_DB_PATH=${IDENTITY_DB_PATH:-/app/data/identity_memory.sqlite3}
      - EMBEDDING_DB_PATH=${EMBEDDING_DB_PATH:-/app/data/embeddings.sqlite3}
      - REID_ENABLED=${REID_ENABLED:-true}
      - REID_CHECKPOINT_PATH=${REID_CHECKPOINT_PATH:-/app/weights/osnet_x1_0_peoplelocation_balanced_v2.pth}
      - REID_DEVICE=${REID_DEVICE:-auto}
      - REID_CROP_MODE=${REID_CROP_MODE:-improved}
      - REID_THRESHOLD_SAFETY_MODE=${REID_THRESHOLD_SAFETY_MODE:-conservative}
      - REID_ASSIGNMENT_DEBUG=${REID_ASSIGNMENT_DEBUG:-true}
      - REID_ASSIGNMENT_TRACE_MAX_BATCHES=${REID_ASSIGNMENT_TRACE_MAX_BATCHES:-1000}
      - LIVE_CAMERA_RECONNECT_INTERVAL_SEC=${LIVE_CAMERA_RECONNECT_INTERVAL_SEC:-1.0}
    restart: unless-stopped

  frontend:
    container_name: peoplelocation-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8899}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
