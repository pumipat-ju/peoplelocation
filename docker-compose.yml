services:
  backend:
    container_name: peoplelocation-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    volumes:
        - ./backend/static:/app/static
        - ./backend/data:/app/data
        - ./backend/yolov8s.pt:/app/yolov8s.pt:ro
        - ${MODEL_WEIGHTS_DIR:-./weights}:/app/weights:ro
    environment:
      - PYTHONUNBUFFERED=1
      - IDENTITY_DB_PATH=${IDENTITY_DB_PATH:-/app/data/identity_memory.sqlite3}
      - REID_ENABLED=${REID_ENABLED:-true}
      - REID_CHECKPOINT_PATH=${REID_CHECKPOINT_PATH:-/app/weights/osnet_x1_0_market1501.pth}
      - REID_DEVICE=${REID_DEVICE:-auto}
      - REID_THRESHOLD_SAFETY_MODE=${REID_THRESHOLD_SAFETY_MODE:-conservative}
      - LIVE_CAMERA_RECONNECT_INTERVAL_SEC=${LIVE_CAMERA_RECONNECT_INTERVAL_SEC:-1.0}
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
  frontend:
    container_name: peoplelocation-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
